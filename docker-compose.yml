services:
  mysql:
    image: mysql:8.4
    container_name: kucur-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kucur}
      MYSQL_USER: ${MYSQL_USER:-kucur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the repository .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the repository .env file}
      KUCUR_TEST_DATABASE: ${KUCUR_TEST_DATABASE:-kucur_test}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - kucur_mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  kucur_mysql_data:
